name: CI

on:
  push:
    branches: [main, gpu-analytics, gpu-phase2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install NVRTC so every CUDA kernel is compile-checked for sm_75 (no GPU needed)
        run: pip install "nvidia-cuda-nvrtc-cu12==12.8.93"

      - name: Build the C++ order book core and run its native tests (including zero allocations)
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)"
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure

      - name: Run Python tests (the binding tests must run, not skip)
        env:
          EE_REQUIRE_NATIVE: "1"
        run: pytest -q

      - name: Differential fuzzer against the C++ core (10,000 seeded streams)
        run: python scripts/fuzz_engine.py --streams 10000 --engine native --progress-every 0

      - name: Run frontend logic tests
        run: node --test tests/frontend/

      - name: Documentation provenance and bullet checks
        run: |
          if [ -f BULLETS.md ]; then
            python scripts/check_numbers.py
            python scripts/check_bullets.py
          else
            echo "documents not rendered yet"
          fi

      - name: GPU tests are skipped on CPU runners
        run: pytest -q -rs tests/test_gpu_marker.py

      - name: Smoke-test the benchmark
        run: python scripts/benchmark.py --orders 5000 --cancels 500
